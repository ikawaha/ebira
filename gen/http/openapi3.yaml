        Notebook:
            type: object
            properties:
                count:
                    type: integer
                    description: Number of notes
                    example: 5834870454193764574
                    format: int64
                id:
                    type: string
                    description: 'Notebook ID, which is also its directory name. It is derived from the display name when the notebook is created: an ASCII name is lower-cased with dashes, and a name with other characters, such as Japanese, is Punycode-encoded into an ID that starts with xn--, as in internationalized domain names. Pass the ID as is wherever a notebook is asked for, and show people the name instead'
                    example: inbox
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                kind:
                    type: string
                    description: Kind of the notebook. AI clients may only read notes in default notebooks, may also create, update and delete notes in collab notebooks, which people share with AI, may only add notes to drop notebooks, whose notes they cannot see, and cannot see private notebooks at all. In the notebook list, AI clients see drop notebooks with a count of 0. A notebook without a kind set is default, except the inbox, which is drop
                    example: private
                    enum:
                        - default
                        - collab
                        - drop
                        - private
                name:
                    type: string
                    description: Display name. Defaults to the ID (Inbox and Trash for the reserved notebooks)
                    example: Aut sed quidem commodi dolore cumque.
                order:
                    type: integer
                    description: Sort key among the notebooks other than inbox and trash; lower comes first
                    example: 5084316890005250992
                    format: int64
                reserved:
                    type: boolean
                    description: Whether this is a system notebook (inbox or trash)
                    example: false
                sort:
                    type: string
                    description: 'Order of the note list: order is the manual order (notes not moved with move come by creation time, newest first), created and updated are newest first, and title is by code point, ignoring case and width'
                    example: created
                    enum:
                        - order
                        - created
                        - updated
                        - title
            example:
                count: 5834870454193764574
                id: inbox
                kind: private
                name: Aut sed quidem commodi dolore cumque.
                order: 5084316890005250992
                reserved: false
                sort: created
            required:
                - id
                - name
                - order
                - count
                - reserved
                - kind
                - sort
        SaveNotebookRequestBody:
            type: object
            properties:
                kind:
                    type: string
                    description: Kind of the notebook. AI clients may only read notes in default notebooks, may also create, update and delete notes in collab notebooks, which people share with AI, may only add notes to drop notebooks, whose notes they cannot see, and cannot see private notebooks at all. In the notebook list, AI clients see drop notebooks with a count of 0. A notebook without a kind set is default, except the inbox, which is drop. Inbox cannot be collab, and the trash keeps the default kind (it is hidden from AI clients anyway)
                    example: collab
                    enum:
                        - default
                        - collab
                        - drop
                        - private
                name:
                    type: string
                    description: Display name; empty to reset it to the default
