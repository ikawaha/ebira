openapi: 3.0.3
info:
    title: ebira API
    description: API for Markdown notes stored as YAML files and searched through a SQLite index.
    version: 0.1.0
servers:
    - url: http://localhost:8080
paths:
    /ask:
        post:
            tags:
                - assistant
            summary: ask assistant
            description: Ask a question about the notes. The agent searches and reads the notes, then answers citing the notes it used. Each question is answered on its own, without the earlier ones.
            operationId: assistant#ask
            requestBody:
                description: Request body for ask.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AskRequestBody'
                        example:
                            question: 8kf
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AskResponseBody'
                            example:
                                answer: Quia molestiae nesciunt qui dignissimos vel.
                "503":
                    description: 'unavailable: The assistant is not configured, such as when no model API key is set'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unavailable
                                temporary: false
                                timeout: false
    /events:
        get:
            tags:
                - notes
            summary: events notes
            description: Stream note changes as Server-Sent Events. Events missed while disconnected are not replayed; the ready event sent on every (re)connection tells clients to reload the note list.
            operationId: notes#events
            responses:
                "200":
                    description: OK response.
                    content:
                        text/event-stream:
                            schema:
                                $ref: '#/components/schemas/NoteEvent'
                            example:
                                id: be4c1193735ee1
                                type: updated
    /files/check:
        get:
            tags:
                - notes
            summary: check_files notes
            description: 'Check the files of notes against the note bodies: list the files that no body refers to, which can be deleted with delete_file, and the references to files that do not exist. A reference is <id>.assets/<name> anywhere in a body, including in code, so that a file counts as used rather than not. Files added within the last hour are marked recent, as the note may still be being edited.'
            operationId: notes#check_files
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FileCheck'
                            example:
                                broken:
                                    - note_id: be4c1193735ee1
                                      path: be4c1193735ee1.assets/screenshot.png
                                      title: Aut eligendi aperiam soluta sunt impedit nihil.
                                    - note_id: be4c1193735ee1
                                      path: be4c1193735ee1.assets/screenshot.png
                                      title: Aut eligendi aperiam soluta sunt impedit nihil.
                                    - note_id: be4c1193735ee1
                                      path: be4c1193735ee1.assets/screenshot.png
                                      title: Aut eligendi aperiam soluta sunt impedit nihil.
                                unused:
                                    - added_at: "2026-10-16T09:30:00Z"
                                      name: screenshot.png
                                      note_id: be4c1193735ee1
                                      path: be4c1193735ee1.assets/screenshot.png
                                      recent: false
                                      size: 4123840254599638639
                                      title: Nesciunt nisi velit sed.
                                    - added_at: "2026-10-16T09:30:00Z"
                                      name: screenshot.png
                                      note_id: be4c1193735ee1
                                      path: be4c1193735ee1.assets/screenshot.png
                                      recent: false
                                      size: 4123840254599638639
                                      title: Nesciunt nisi velit sed.
    /git/status:
        get:
            tags:
                - notes
            summary: git_status notes
            description: Tell whether the notes are in a git repository, and its upstream branch, such as to offer git_sync. For people only; others are told there is none.
            operationId: notes#git_status
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GitStatus'
                            example:
                                repository: false
                                upstream: origin/main
    /git/sync:
        post:
            tags:
                - notes
            summary: git_sync notes
            description: 'Sync the notes with their git repository: commit the changes of the notes directory, then, when the branch has an upstream branch, fetch it, merge it and push. A merge never stops in conflict: a note changed on both sides keeps this side''s version, and the other side''s version becomes a new note in the same notebook, with the conflict in its title; another file keeps this side''s version; a file deleted on one side and changed on the other keeps the changed version. The index is updated afterwards. For people only.'
            operationId: notes#git_sync
            requestBody:
                description: Request body for git_sync.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GitSyncRequestBody'
                        example:
                            remote: git@github.com:you/notes.git
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GitSyncResult'
                            example:
                                committed: 4587836341878086885
                                conflicts:
                                    - copy_id: be4c1193735ee1
                                      note_id: be4c1193735ee1
                                      path: inbox/3f9a1c0e7b2d4a.yaml
                                    - copy_id: be4c1193735ee1
                                      note_id: be4c1193735ee1
                                      path: inbox/3f9a1c0e7b2d4a.yaml
                                    - copy_id: be4c1193735ee1
                                      note_id: be4c1193735ee1
                                      path: inbox/3f9a1c0e7b2d4a.yaml
                                    - copy_id: be4c1193735ee1
                                      note_id: be4c1193735ee1
                                      path: inbox/3f9a1c0e7b2d4a.yaml
                                errors:
                                    - Odit libero quae odit culpa illo.
                                    - Exercitationem consequatur.
                                    - Nobis aliquam.
                                    - Labore voluptate aut ducimus saepe.
                                merged: 7055638964112614605
                                pushed: true
                                upstream: origin/main
                "400":
                    description: 'bad_request: The notes are not in a git repository, the repository is in the middle of an operation such as a merge, a file outside the notes changed on both sides, the remote origin is another repository, or a git command failed, such as a push'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: bad_request
                                temporary: false
                                timeout: false
                "403":
                    description: 'forbidden: The caller is not a person'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: forbidden
                                temporary: false
                                timeout: false
    /import:
        post:
            tags:
                - notes
            summary: import notes
            description: Import a Markdown file as a new note with a random ID. A file whose content was imported before, even if the note is in the trash, is skipped unless force is set. Images the file refers to by relative paths can be sent with it; they are added to the note and the body refers to them.
            operationId: notes#import
            requestBody:
                description: Request body for import.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ImportRequestBody'
                        example:
                            content: fsn
                            files:
                                - content: Tm9iaXMgbm9zdHJ1bS4=
                                  name: photo.png
                                  ref: images/photo.png
                                - content: Tm9iaXMgbm9zdHJ1bS4=
                                  name: photo.png
                                  ref: images/photo.png
                                - content: Tm9iaXMgbm9zdHJ1bS4=
                                  name: photo.png
                                  ref: images/photo.png
                            force: true
                            modified_at: "2026-10-16T09:30:00Z"
                            name: meeting.md
                            notebook: inbox
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ImportResult'
                            example:
                                duplicate_of: be4c1193735ee1
                                note:
                                    body: Et libero.
                                    body_highlights:
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                    created_at: "2026-10-16T09:30:00Z"
                                    created_by: ai
                                    id: be4c1193735ee1
                                    notebook: inbox
                                    tags:
                                        - DB
                                        - postgres
                                    title: Get the CREATE TABLE statement
                                    title_highlights:
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                    trashed_from: inbox
                                    trashed_notebook: inbox
                                    updated_at: "2026-10-16T09:30:00Z"
                                    version: '"87ef7c76b82c5b1d299b08b474f6a7bb"'
                                status: skipped
                                warnings:
                                    - Quo rem cumque est.
                                    - Error illum repellat.
                "400":
                    description: 'bad_request: The notebook is the trash or invalid, or the file is too large'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: bad_request
                                temporary: false
                                timeout: false
    /notebooks:
        get:
            tags:
                - notes
            summary: notebooks notes
            description: 'List notebooks with their note counts: inbox first, then the others by order and name, trash last.'
            operationId: notes#notebooks
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Notebook'
                                example:
                                    - count: 5834870454193764574
                                      id: inbox
                                      kind: private
                                      name: Aut sed quidem commodi dolore cumque.
                                      order: 5084316890005250992
                                      reserved: false
                                      sort: created
                                    - count: 5834870454193764574
                                      id: inbox
                                      kind: private
                                      name: Aut sed quidem commodi dolore cumque.
                                      order: 5084316890005250992
                                      reserved: false
                                      sort: created
                                    - count: 5834870454193764574
                                      id: inbox
                                      kind: private
                                      name: Aut sed quidem commodi dolore cumque.
                                      order: 5084316890005250992
                                      reserved: false
                                      sort: created
                            example:
                                - count: 5834870454193764574
                                  id: inbox
                                  kind: private
                                  name: Aut sed quidem commodi dolore cumque.
                                  order: 5084316890005250992
                                  reserved: false
                                  sort: created
                                - count: 5834870454193764574
                                  id: inbox
                                  kind: private
                                  name: Aut sed quidem commodi dolore cumque.
                                  order: 5084316890005250992
                                  reserved: false
                                  sort: created
                                - count: 5834870454193764574
                                  id: inbox
                                  kind: private
                                  name: Aut sed quidem commodi dolore cumque.
                                  order: 5084316890005250992
                                  reserved: false
                                  sort: created
        post:
            tags:
                - notes
            summary: create_notebook notes
            description: 'Create a notebook from its display name. The ID, which is also the directory name, is derived from the name with only the characters an ID allows: an ASCII name is lower-cased with dashes ("My Notes" gives my-notes), and any other name is Punycode-encoded as in internationalized domain names, giving an ID that starts with xn--. A suffix such as -2 is added when the ID is taken.'
            operationId: notes#create_notebook
            requestBody:
                description: Request body for create_notebook.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateNotebookRequestBody'
                        example:
                            kind: private
                            name: vo3
                            order: 6679760426203438774
            responses:
                "201":
                    description: Created response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Notebook'
                            example:
                                count: 1976420201218874438
                                id: inbox
                                kind: private
                                name: Facilis tenetur mollitia eligendi iusto ipsam.
                                order: 853687201135527360
                                reserved: false
                                sort: order
                "400":
                    description: 'bad_request: The name is empty'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: bad_request
                                temporary: false
                                timeout: false
                "409":
                    description: 'already_exists: A notebook with the name exists'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: already_exists
                                temporary: false
                                timeout: false
    /notebooks/{id}:
        delete:
            tags:
                - notes
            summary: delete_notebook notes
            description: Move a notebook with its notes and settings into the trash. Inbox and trash cannot be deleted. Fails with already_exists if the trash holds a notebook with the same ID.
            operationId: notes#delete_notebook
            parameters:
                - name: id
                  in: path
                  description: Notebook ID
                  required: true
                  schema:
                    type: string
                    description: Notebook ID
                    example: inbox
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                  example: inbox
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: 'bad_request: The notebook is inbox or trash'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: bad_request
                                temporary: false
                                timeout: false
                "404":
                    description: 'not_found: The notebook does not exist'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: not_found
                                temporary: false
                                timeout: false
                "409":
                    description: 'already_exists: The trash holds a notebook with the same ID'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: already_exists
                                temporary: false
                                timeout: false
        put:
            tags:
                - notes
            summary: save_notebook notes
            description: Set the display name, order, kind or note sort of a notebook, creating the notebook if it does not exist. The order of inbox and trash cannot be changed.
            operationId: notes#save_notebook
            parameters:
                - name: id
                  in: path
                  description: Notebook ID
                  required: true
                  schema:
                    type: string
                    description: Notebook ID
                    example: inbox
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                  example: inbox
            requestBody:
                description: Request body for save_notebook.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SaveNotebookRequestBody'
                        example:
                            kind: collab
                            name: Commodi vel.
                            order: 6133899287636492423
                            sort: updated
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Notebook'
                            example:
                                count: 2957139930633743807
                                id: inbox
                                kind: default
                                name: Est est omnis at sit.
                                order: 2140168914686218780
                                reserved: false
                                sort: updated
                "400":
                    description: 'bad_request: The change is not allowed for the notebook, such as an order for inbox or trash'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: bad_request
                                temporary: false
                                timeout: false
                "404":
                    description: 'not_found: The notebook does not exist'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: not_found
                                temporary: false
                                timeout: false
    /notes:
        get:
            tags:
                - notes
            summary: list notes
            description: 'List notes in the order of sort, a page at a time: total tells how many there are, and offset reads the next page.'
            operationId: notes#list
            parameters:
                - name: notebook
                  in: query
                  description: Only notes in this notebook. Omit for all notebooks except the trash
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Only notes in this notebook. Omit for all notebooks except the trash
                    example: inbox
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                  example: inbox
                - name: tag
                  in: query
                  description: Only notes with this tag
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Only notes with this tag
                    example: Nulla molestiae voluptatum et.
                  example: Nulla molestiae voluptatum et.
                - name: limit
                  in: query
                  description: Maximum number of notes
                  allowEmptyValue: true
                  schema:
                    type: integer
                    description: Maximum number of notes
                    default: 50
                    example: 256
                    format: int64
                    minimum: 1
                    maximum: 500
                  example: 256
                - name: offset
                  in: query
                  description: Number of notes to skip
                  allowEmptyValue: true
                  schema:
                    type: integer
                    description: Number of notes to skip
                    default: 0
                    example: 1000684163214453032
                    format: int64
                    minimum: 0
                  example: 1000684163214453032
                - name: trashed_notebook
                  in: query
                  description: With notebook=trash, list the notes of this notebook in the trash instead of the notes deleted on their own
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: With notebook=trash, list the notes of this notebook in the trash instead of the notes deleted on their own
                    example: inbox
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                  example: inbox
                - name: sort
                  in: query
                  description: 'Order of the note list: order is the manual order (notes not moved with move come by creation time, newest first), created and updated are newest first, and title is by code point, ignoring case and width. Omit for the sort setting of the notebook (order without a notebook)'
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: 'Order of the note list: order is the manual order (notes not moved with move come by creation time, newest first), created and updated are newest first, and title is by code point, ignoring case and width. Omit for the sort setting of the notebook (order without a notebook)'
                    example: order
                    enum:
                        - order
                        - created
                        - updated
                        - title
                  example: order
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NoteList'
                            example:
                                notes:
                                    - created_at: "2026-10-16T09:30:00Z"
                                      created_by: ai
                                      id: be4c1193735ee1
                                      notebook: inbox
                                      snippet: Vel omnis omnis iure molestias iure eveniet.
                                      snippet_highlights:
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                      tags:
                                        - DB
                                        - postgres
                                      title: Get the CREATE TABLE statement
                                      title_highlights:
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                      trashed_notebook: inbox
                                      updated_at: "2026-10-16T09:30:00Z"
                                    - created_at: "2026-10-16T09:30:00Z"
                                      created_by: ai
                                      id: be4c1193735ee1
                                      notebook: inbox
                                      snippet: Vel omnis omnis iure molestias iure eveniet.
                                      snippet_highlights:
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                      tags:
                                        - DB
                                        - postgres
                                      title: Get the CREATE TABLE statement
                                      title_highlights:
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                      trashed_notebook: inbox
                                      updated_at: "2026-10-16T09:30:00Z"
                                    - created_at: "2026-10-16T09:30:00Z"
                                      created_by: ai
                                      id: be4c1193735ee1
                                      notebook: inbox
                                      snippet: Vel omnis omnis iure molestias iure eveniet.
                                      snippet_highlights:
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                      tags:
                                        - DB
                                        - postgres
                                      title: Get the CREATE TABLE statement
                                      title_highlights:
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                        - end: 9063689078350173992
                                          start: 5812498383206549952
                                      trashed_notebook: inbox
                                      updated_at: "2026-10-16T09:30:00Z"
                                total: 7955538707107640227
                "400":
                    description: 'bad_request: trashed_notebook is given without notebook=trash'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: bad_request
                                temporary: false
                                timeout: false
        post:
            tags:
                - notes
            summary: create notes
            description: Create a note. A random ID is assigned when id is omitted, and the note goes to the inbox when notebook is omitted. A new notebook is created on demand.
            operationId: notes#create
            requestBody:
                description: Request body for create.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateRequestBody'
                        example:
                            body: Quaerat nisi.
                            id: be4c1193735ee1
                            notebook: inbox
                            tags:
                                - Possimus dolor aliquid.
                                - Aut voluptatibus qui.
                                - Sit rerum rerum nobis.
                                - Rerum dolores sapiente iure ducimus.
                            title: r1
            responses:
                "201":
                    description: Created response.
                    headers:
                        ETag:
                            description: Strong entity tag of the note file. Sent as the ETag header over HTTP
                            schema:
                                type: string
                                description: Strong entity tag of the note file. Sent as the ETag header over HTTP
                                example: '"87ef7c76b82c5b1d299b08b474f6a7bb"'
                            example: '"87ef7c76b82c5b1d299b08b474f6a7bb"'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Note'
                            example:
                                body: Odio sunt.
                                body_highlights:
                                    - end: 9063689078350173992
