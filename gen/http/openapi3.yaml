    schemas:
        AskRequestBody:
            type: object
            properties:
                question:
                    type: string
                    description: Question
                    example: 8kf
                    minLength: 1
                    maxLength: 2000
            description: Request body for ask.
            example:
                question: 8kf
            required:
                - question
        AskResponseBody:
            type: object
            properties:
                answer:
                    type: string
                    description: Answer in Markdown
                    example: Quia molestiae nesciunt qui dignissimos vel.
            example:
                answer: Quia molestiae nesciunt qui dignissimos vel.
            required:
                - answer
        BrokenFileRef:
            type: object
            properties:
                note_id:
                    type: string
                    description: ID of the note whose body has the reference
                    example: be4c1193735ee1
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                path:
                    type: string
                    description: The path referred to
                    example: be4c1193735ee1.assets/screenshot.png
                title:
                    type: string
                    description: Title of the note whose body has the reference
                    example: Aut eligendi aperiam soluta sunt impedit nihil.
            example:
                note_id: be4c1193735ee1
                path: be4c1193735ee1.assets/screenshot.png
                title: Aut eligendi aperiam soluta sunt impedit nihil.
            required:
                - note_id
                - title
                - path
        CreateNotebookRequestBody:
            type: object
            properties:
                kind:
                    type: string
                    description: Kind of the notebook. AI clients may only read notes in default notebooks, may also create, update and delete notes in collab notebooks, which people share with AI, may only add notes to drop notebooks, whose notes they cannot see, and cannot see private notebooks at all. In the notebook list, AI clients see drop notebooks with a count of 0. A notebook without a kind set is default, except the inbox, which is drop
                    default: default
                    example: private
                    enum:
                        - default
                        - collab
                        - drop
                        - private
                name:
                    type: string
                    description: Display name
                    example: vo3
                    minLength: 1
                    maxLength: 100
                order:
                    type: integer
                    description: Sort key; lower comes first. Omit to put the notebook after the others
                    example: 6679760426203438774
                    format: int64
            description: Request body for create_notebook.
            example:
                kind: private
                name: vo3
                order: 6679760426203438774
            required:
                - name
        CreateRequestBody:
            type: object
            properties:
                body:
                    type: string
                    description: Body in Markdown
                    example: Quaerat nisi.
                id:
                    type: string
                    description: Note ID
                    example: be4c1193735ee1
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                notebook:
                    type: string
                    description: Notebook to put the note in (default inbox; not trash)
                    example: inbox
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                tags:
                    type: array
                    items:
                        type: string
                        example: Possimus dolor aliquid.
                    description: Tags
                    example:
                        - Possimus dolor aliquid.
                        - Aut voluptatibus qui.
                        - Sit rerum rerum nobis.
                        - Rerum dolores sapiente iure ducimus.
                title:
                    type: string
                    description: Title
                    example: r1
                    minLength: 1
            description: Request body for create.
            example:
                body: Quaerat nisi.
                id: be4c1193735ee1
                notebook: inbox
                tags:
                    - Possimus dolor aliquid.
                    - Aut voluptatibus qui.
                    - Sit rerum rerum nobis.
                    - Rerum dolores sapiente iure ducimus.
                title: r1
            required:
                - title
