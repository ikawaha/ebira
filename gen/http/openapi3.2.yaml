        GitConflict:
            type: object
            properties:
                copy_id:
                    type: string
                    description: ID of the new note made from the other side's version of the note, when both sides changed it
                    example: be4c1193735ee1
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                note_id:
                    type: string
                    description: ID of the note of the file, for a note's file
                    example: be4c1193735ee1
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                path:
                    type: string
                    description: File, relative to the notes directory; this side's version is kept, or the changed version when the other side deleted it
                    example: inbox/3f9a1c0e7b2d4a.yaml
            example:
                copy_id: be4c1193735ee1
                note_id: be4c1193735ee1
                path: inbox/3f9a1c0e7b2d4a.yaml
