                        - Error illum repellat.
            example:
                duplicate_of: be4c1193735ee1
                note:
                    archived: true
                    archived_at: "2026-10-16T09:30:00Z"
                    body: Et libero.
                    body_highlights:
                        - end: 9063689078350173992
                          start: 5812498383206549952
                        - end: 9063689078350173992
                          start: 5812498383206549952
                        - end: 9063689078350173992
                          start: 5812498383206549952
                    created_at: "2026-10-16T09:30:00Z"
                    created_by: ai
                    id: be4c1193735ee1
                    marks:
                        - red
                    notebook: inbox
