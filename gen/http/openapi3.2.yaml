    /archive/notes:
        post:
            tags:
                - notes
            summary: archive_notes notes
            description: 'Put notes in the archive, or take them out, at once, such as several chosen in a list. The archive holds notes and notebooks kept but no longer in use, which lists and searches leave out unless they ask for them. The notes keep their notebooks, and the update time stays. The notes are checked first: when one does not exist or is in the trash, none is changed. A note in a notebook in the archive stays there with its notebook.'
            operationId: notes#archive_notes
            requestBody:
                description: Request body for archive_notes.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ArchiveNotesRequestBody'
                        example:
                            archived: true
                            ids:
                                - be4c1193735ee1
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: 'bad_request: A note is in the trash, or its ID is used in more than one notebook'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: bad_request
                                temporary: false
                                timeout: false
                "401":
                    description: 'unauthorized: The session is invalid or expired: sign in with a passkey again'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unauthorized
                                temporary: false
                                timeout: false
                "403":
                    description: 'verification_required: An important operation, such as making a private notebook visible to AI, reading the history of a note or emptying the trash, while passkeys are required and the session was not signed in with a passkey recently: sign in with the passkey again'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: verification_required
                                temporary: false
                                timeout: false
                "404":
                    description: 'not_found: A note does not exist'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: not_found
                                temporary: false
                                timeout: false
            security:
                - session_cookie_ebira_session: []
    /ask:
        get:
            tags:
                - assistant
            summary: status assistant
            description: Tell whether the assistant can answer questions, so that a UI can say so before a question is asked.
            operationId: assistant#status
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatusResponseBody'
                            example:
                                available: false
                                reason: Sit eligendi quod dolores.
                "401":
                    description: 'unauthorized: The session is invalid or expired: sign in with a passkey again'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unauthorized
                                temporary: false
                                timeout: false
                "503":
                    description: 'unavailable: The assistant is not configured, such as when no model API key is set'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unavailable
                                temporary: false
                                timeout: false
            security:
                - session_cookie_ebira_session: []
        post:
            tags:
                - assistant
            summary: ask assistant
            description: Ask a question about the notes. The agent searches and reads the notes, then answers citing the notes it used. Each question is answered on its own, without the earlier ones.
            operationId: assistant#ask
            requestBody:
                description: Request body for ask.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AskRequestBody'
                        example:
                            question: 8kf
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AskResponseBody'
                            example:
                                answer: Quia molestiae nesciunt qui dignissimos vel.
                "401":
                    description: 'unauthorized: The session is invalid or expired: sign in with a passkey again'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unauthorized
                                temporary: false
                                timeout: false
                "503":
                    description: 'unavailable: The assistant is not configured, such as when no model API key is set'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unavailable
                                temporary: false
                                timeout: false
            security:
                - session_cookie_ebira_session: []
    /auth:
        get:
            tags:
                - auth
            summary: status auth
            description: Tell how the server authenticates people and whether the request is signed in.
            operationId: auth#status
            parameters:
                - name: ebira_session
                  in: cookie
                  description: Session cookie
                  schema:
                    type: string
                    description: Session cookie
                    example: Qui voluptas perspiciatis sunt consequuntur suscipit fugit.
                  example: Qui voluptas perspiciatis sunt consequuntur suscipit fugit.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatusResponseBody2'
                            example:
                                mode: passkey
                                registered: false
                                signed_in: true
    /auth/device:
        post:
            tags:
                - auth
            summary: device_start auth
            description: Begin signing in a client without a browser, such as the TUI. The client shows the user code and the URL, people approve the code in the web UI, signed in with a passkey, and the client gets a session from device_token meanwhile.
            operationId: auth#device_start
            parameters:
                - name: client
                  in: query
                  description: 'What asks to sign in, which the web UI shows when people approve it: tui for the TUI, cli for a command such as ebira import'
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: 'What asks to sign in, which the web UI shows when people approve it: tui for the TUI, cli for a command such as ebira import'
                    example: tui
                    enum:
                        - tui
                        - cli
                  example: tui
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeviceStartResponseBody'
                            example:
                                device_code: Id sunt praesentium sit et nesciunt debitis.
                                expires_in: 2410708439063718888
                                interval: 1594048462833705464
                                user_code: BCDF-GHJK
                                verification_uri: Omnis inventore et rem dolorem.
    /auth/device/{user_code}:
        get:
            tags:
                - auth
            summary: device_request auth
            description: 'Tell the web UI, signed in with a passkey, about the request of device_start with a user code before people approve it: when it was made, and by what.'
            operationId: auth#device_request
            parameters:
                - name: user_code
                  in: path
                  description: User code shown by the client
                  required: true
                  schema:
                    type: string
                    description: User code shown by the client
                    example: Explicabo natus.
                  example: Explicabo natus.
                - name: ebira_session
                  in: cookie
                  description: Session cookie of the web UI
                  schema:
                    type: string
                    description: Session cookie of the web UI
                    example: Nisi et fugiat in.
                  example: Nisi et fugiat in.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeviceRequestResponseBody'
                            example:
                                client: Distinctio ad.
                                created_at: "1974-06-23T11:33:05Z"
                                expires_in: 750965102598955012
                "401":
                    description: 'unauthorized: The request is not signed in with a passkey'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unauthorized
                                temporary: false
                                timeout: false
                "404":
                    description: 'not_found: The user code is unknown or expired'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: not_found
                                temporary: false
                                timeout: false
    /auth/device/approve:
        post:
            tags:
                - auth
            summary: device_approve auth
            description: Approve the request of device_start with its user code, from the web UI signed in with a passkey recently, as the session it gives lasts as long as one of a sign-in.
            operationId: auth#device_approve
            parameters:
                - name: ebira_session
                  in: cookie
                  description: Session cookie of the web UI
                  schema:
                    type: string
                    description: Session cookie of the web UI
                    example: Reiciendis accusantium.
                  example: Reiciendis accusantium.
            requestBody:
                description: Request body for device_approve.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeviceApproveRequestBody'
                        example:
                            user_code: Fugit voluptate vel.
            responses:
                "204":
                    description: No Content response.
                "401":
                    description: 'unauthorized: The request is not signed in with a passkey'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unauthorized
                                temporary: false
                                timeout: false
                "403":
                    description: 'verification_required: The session is not signed in with a passkey recently: sign in again'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: verification_required
                                temporary: false
                                timeout: false
                "404":
                    description: 'not_found: The user code is unknown or expired'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: not_found
                                temporary: false
                                timeout: false
    /auth/device/token:
        post:
            tags:
                - auth
            summary: device_token auth
            description: Ask whether people approved the request of device_start. Once approved, the result has the session, which the client keeps in memory only and sends as the session cookie; the request is then gone.
            operationId: auth#device_token
            requestBody:
                description: Request body for device_token.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeviceTokenRequestBody'
                        example:
                            device_code: Perferendis maiores.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeviceTokenResponseBody'
                            example:
                                session: Qui neque voluptas vitae.
                                status: expired
    /auth/logout:
        post:
            tags:
                - auth
            summary: logout auth
            description: 'Sign out: the response clears the session cookie.'
            operationId: auth#logout
            responses:
                "204":
                    description: No Content response.
                    headers:
                        Set-Cookie:
                            description: Empty session
                            schema:
                                type: string
                                description: Empty session
                                example: Ipsa non sint.
                            example: Ipsa non sint.
    /auth/passkey/login/begin:
        post:
            tags:
                - auth
            summary: login_begin auth
            description: Begin signing in with a passkey.
            operationId: auth#login_begin
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ceremony'
                            example:
                                ceremony: Sed quia labore.
                                options: Necessitatibus explicabo ut quod incidunt vel.
                "400":
                    description: 'bad_request: No passkey is registered'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: bad_request
                                temporary: false
                                timeout: false
    /auth/passkey/login/finish:
        post:
            tags:
                - auth
            summary: login_finish auth
            description: Finish signing in with the passkey the browser used. The response sets the session cookie.
            operationId: auth#login_finish
            requestBody:
                description: Request body for login_finish.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CeremonyFinish'
                        example:
                            ceremony: Assumenda dolorum commodi maxime magnam.
                            credential: Aut doloribus nobis quia omnis.
            responses:
                "204":
                    description: No Content response.
                    headers:
                        Set-Cookie:
                            description: Session
                            schema:
                                type: string
                                description: Session
                                example: Perspiciatis asperiores reiciendis amet fuga.
                            example: Perspiciatis asperiores reiciendis amet fuga.
                "401":
                    description: 'unauthorized: The ceremony is unknown or expired, or the passkey is not registered or its signature is invalid'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unauthorized
                                temporary: false
                                timeout: false
    /auth/passkey/register/begin:
        post:
            tags:
                - auth
            summary: register_begin auth
            description: 'Begin registering a passkey: with the one-time token of the URL that ebira auth passkey prints in the terminal, so that only people at the terminal can register the first passkey, or, to add another passkey, without a token from the web UI signed in and verified with a passkey.'
            operationId: auth#register_begin
            parameters:
                - name: ebira_session
                  in: cookie
                  description: Session cookie
                  schema:
                    type: string
                    description: Session cookie
                    example: Dolorem molestiae officia porro voluptatem eius mollitia.
                  example: Dolorem molestiae officia porro voluptatem eius mollitia.
            requestBody:
                description: Request body for register_begin.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterBeginRequestBody'
                        example:
                            token: Et recusandae esse ad.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ceremony'
                            example:
                                ceremony: Dolorum pariatur necessitatibus occaecati magnam.
                                options: Maxime atque dolor ex saepe a consequatur.
                "403":
                    description: 'verification_required: Without a token: the session is missing, or not signed in with a passkey recently'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: verification_required
                                temporary: false
                                timeout: false
    /auth/passkey/register/finish:
        post:
            tags:
                - auth
            summary: register_finish auth
            description: Finish registering a passkey with the credential the browser created.
            operationId: auth#register_finish
            requestBody:
                description: Request body for register_finish.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CeremonyFinish'
                        example:
                            ceremony: Tempore et unde assumenda pariatur facilis.
                            credential: Quia quia tenetur assumenda consequatur eius.
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: 'bad_request: The ceremony is unknown or expired, or the credential is invalid'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: bad_request
                                temporary: false
                                timeout: false
    /auth/passkeys:
        get:
            tags:
                - auth
            summary: passkeys auth
            description: List the registered passkeys, for the web UI signed in with a passkey.
            operationId: auth#passkeys
            parameters:
                - name: ebira_session
                  in: cookie
                  description: Session cookie
                  schema:
                    type: string
                    description: Session cookie
