            security: []
components:
    schemas:
        AddGuideRequestBody:
            type: object
            properties:
                lang:
                    type: string
                    description: Language of the guide (default en)
                    example: ja
                    enum:
                        - en
                        - ja
            description: Request body for add_guide.
            example:
                lang: ja
        ArchiveNotesRequestBody:
            type: object
            properties:
                archived:
                    type: boolean
                    description: true to put the notes in the archive, false to take them out
                    example: true
                ids:
                    type: array
                    items:
                        type: string
                        example: be4c1193735ee1
                        pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                    description: IDs of the notes
                    example:
                        - be4c1193735ee1
                    minItems: 1
                    maxItems: 500
            description: Request body for archive_notes.
            example:
                archived: true
                ids:
                    - be4c1193735ee1
            required:
                - ids
                - archived
        AskRequestBody:
            type: object
            properties:
                question:
                    type: string
                    description: Question
                    example: 8kf
                    minLength: 1
                    maxLength: 2000
            description: Request body for ask.
            example:
                question: 8kf
            required:
                - question
        AskResponseBody:
            type: object
            properties:
                answer:
                    type: string
                    description: Answer in Markdown
                    example: Quia molestiae nesciunt qui dignissimos vel.
            example:
                answer: Quia molestiae nesciunt qui dignissimos vel.
            required:
                - answer
        BrokenFileRef:
            type: object
            properties:
                note_id:
                    type: string
                    description: ID of the note whose body has the reference
                    example: be4c1193735ee1
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                path:
                    type: string
                    description: The path referred to
                    example: be4c1193735ee1.assets/screenshot.png
                title:
                    type: string
                    description: Title of the note whose body has the reference
                    example: Aut eligendi aperiam soluta sunt impedit nihil.
            example:
                note_id: be4c1193735ee1
                path: be4c1193735ee1.assets/screenshot.png
                title: Aut eligendi aperiam soluta sunt impedit nihil.
            required:
                - note_id
                - title
                - path
        Ceremony:
            type: object
            properties:
                ceremony:
                    type: string
                    description: ID of the ceremony, passed back when finishing it
                    example: Dolorum pariatur necessitatibus occaecati magnam.
                options:
                    description: 'Options of the ceremony for the browser, in the JSON form of the Web Authentication API: PublicKeyCredentialCreationOptionsJSON for a registration, PublicKeyCredentialRequestOptionsJSON for a sign-in'
                    example: Maxime atque dolor ex saepe a consequatur.
            example:
                ceremony: Dolorum pariatur necessitatibus occaecati magnam.
                options: Maxime atque dolor ex saepe a consequatur.
            required:
                - ceremony
                - options
        CeremonyFinish:
            type: object
            properties:
                ceremony:
                    type: string
                    description: ID of the ceremony, from its first step
                    example: Tempore et unde assumenda pariatur facilis.
                credential:
                    description: Credential the browser created or used, as PublicKeyCredential.toJSON returns it
                    example: Quia quia tenetur assumenda consequatur eius.
            description: Request body for register_finish.
            example:
                ceremony: Tempore et unde assumenda pariatur facilis.
                credential: Quia quia tenetur assumenda consequatur eius.
            required:
                - ceremony
                - credential
        CreateNotebookRequestBody:
            type: object
            properties:
                kind:
                    type: string
                    description: Kind of the notebook. AI clients may only read notes in default notebooks, may also create, update and delete notes in collab notebooks, which people share with AI, may only add notes to drop notebooks, whose notes they cannot see, and cannot see private notebooks at all. In the notebook list, AI clients see drop notebooks with a count of 0. A notebook without a kind set is default, except the inbox, which is drop. Ignored for a sub notebook, which takes the kind of its parent until save_notebook sets one
                    default: default
                    example: private
                    enum:
                        - default
                        - collab
                        - drop
                        - private
                name:
                    type: string
                    description: Display name
                    example: vo3
                    minLength: 1
                    maxLength: 100
                order:
                    type: integer
                    description: Sort key; lower comes first. Omit to put the notebook after the others
                    example: 6679760426203438774
                    format: int64
                parent:
                    type: string
                    description: 'Notebook to create the notebook in, as a sub notebook, one level deep: not a sub notebook, the inbox or the trash'
                    example: inbox
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}(/[a-z0-9][a-z0-9_-]{0,63})?$
            description: Request body for create_notebook.
            example:
                kind: private
                name: vo3
                order: 6679760426203438774
                parent: inbox
            required:
                - name
        CreateRequestBody:
            type: object
            properties:
                body:
                    type: string
                    description: Body in Markdown
                    example: Quaerat nisi.
                id:
                    type: string
                    description: 'Note ID. A link to a note in the web UI, such as http://localhost:13579/#note/be4c1193735ee1, names the note by the ID after #note/'
                    example: be4c1193735ee1
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                notebook:
                    type: string
                    description: Notebook to put the note in (default inbox; not trash)
                    example: inbox
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}(/[a-z0-9][a-z0-9_-]{0,63})?$
                tags:
                    type: array
                    items:
                        type: string
                        example: Possimus dolor aliquid.
                    description: Tags
                    example:
                        - Possimus dolor aliquid.
                        - Aut voluptatibus qui.
                        - Sit rerum rerum nobis.
                        - Rerum dolores sapiente iure ducimus.
                title:
                    type: string
                    description: Title
                    example: r1
                    minLength: 1
            description: Request body for create.
            example:
                body: Quaerat nisi.
                id: be4c1193735ee1
                notebook: inbox
                tags:
                    - Possimus dolor aliquid.
                    - Aut voluptatibus qui.
                    - Sit rerum rerum nobis.
                    - Rerum dolores sapiente iure ducimus.
                title: r1
            required:
                - title
        CreateSeparatorRequestBody:
            type: object
            properties:
                after:
                    type: string
                    description: ID of the note or the separator of the same notebook to put it after in the manual order; omit to put it first
                    example: be4c1193735ee1
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                color:
                    type: string
                    description: Color of the bar, one of the color marks; omit for the plain one
                    example: blue
                    enum:
                        - red
                        - orange
                        - yellow
                        - green
                        - blue
                        - purple
                        - gray
                date:
                    type: string
                    description: Date to show, as YYYY-MM-DD; omit for none
                    example: "2026-10-01"
                    format: date
                notebook:
                    type: string
                    description: Notebook to put the separator in; not the trash
                    example: inbox
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}(/[a-z0-9][a-z0-9_-]{0,63})?$
                title:
                    type: string
                    description: Heading; omit for none
                    example: October
                    maxLength: 200
            description: Request body for create_separator.
            example:
                after: be4c1193735ee1
                color: blue
                date: "2026-10-01"
                notebook: inbox
                title: October
            required:
                - notebook
        DeviceApproveRequestBody:
            type: object
            properties:
                user_code:
                    type: string
                    description: User code shown by the client
                    example: Fugit voluptate vel.
            description: Request body for device_approve.
            example:
                user_code: Fugit voluptate vel.
            required:
                - user_code
        DeviceRequestResponseBody:
            type: object
            properties:
                client:
                    type: string
                    description: 'What made it, as device_start tells: tui or cli; none for a client that does not tell'
                    example: Distinctio ad.
                created_at:
                    type: string
                    description: When the request was made, in RFC 3339
                    example: "1974-06-23T11:33:05Z"
                    format: date-time
                expires_in:
                    type: integer
                    description: Seconds until the request expires
                    example: 750965102598955012
                    format: int64
            example:
                client: Distinctio ad.
                created_at: "1974-06-23T11:33:05Z"
                expires_in: 750965102598955012
            required:
                - created_at
                - expires_in
        DeviceStartResponseBody:
            type: object
            properties:
                device_code:
                    type: string
                    description: Secret code the client asks device_token with; never shown to people
                    example: Id sunt praesentium sit et nesciunt debitis.
                expires_in:
                    type: integer
                    description: Seconds until the request expires
                    example: 2410708439063718888
                    format: int64
                interval:
                    type: integer
                    description: Seconds to wait between calls of device_token
                    example: 1594048462833705464
                    format: int64
                user_code:
                    type: string
                    description: Code people compare with the one in the web UI before approving it
                    example: BCDF-GHJK
                verification_uri:
                    type: string
                    description: URL of the page of the web UI that approves the user code
                    example: Omnis inventore et rem dolorem.
            example:
                device_code: Id sunt praesentium sit et nesciunt debitis.
                expires_in: 2410708439063718888
                interval: 1594048462833705464
                user_code: BCDF-GHJK
                verification_uri: Omnis inventore et rem dolorem.
            required:
                - device_code
                - user_code
                - verification_uri
                - expires_in
                - interval
        DeviceTokenRequestBody:
            type: object
            properties:
                device_code:
                    type: string
                    description: Device code from device_start
                    example: Perferendis maiores.
            description: Request body for device_token.
            example:
                device_code: Perferendis maiores.
            required:
                - device_code
        DeviceTokenResponseBody:
            type: object
            properties:
                session:
                    type: string
                    description: Session, when approved
                    example: Qui neque voluptas vitae.
                status:
                    type: string
                    description: 'pending: not approved yet; approved: the result has the session; expired: the request expired or is unknown, so begin again'
                    example: expired
                    enum:
                        - pending
                        - approved
                        - expired
            example:
                session: Qui neque voluptas vitae.
                status: expired
            required:
                - status
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: false
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: true
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: true
            description: Error response result type
            example:
                fault: false
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: true
                timeout: true
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
        FileCheck:
            type: object
            properties:
                broken:
                    type: array
                    items:
                        $ref: '#/components/schemas/BrokenFileRef'
                    description: References to files that do not exist, sorted by note and path
                    example:
                        - note_id: be4c1193735ee1
                          path: be4c1193735ee1.assets/screenshot.png
                          title: Aut eligendi aperiam soluta sunt impedit nihil.
                        - note_id: be4c1193735ee1
                          path: be4c1193735ee1.assets/screenshot.png
                          title: Aut eligendi aperiam soluta sunt impedit nihil.
                        - note_id: be4c1193735ee1
                          path: be4c1193735ee1.assets/screenshot.png
                          title: Aut eligendi aperiam soluta sunt impedit nihil.
                unused:
                    type: array
                    items:
                        $ref: '#/components/schemas/UnusedFile'
