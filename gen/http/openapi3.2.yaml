                            - important
                            - question
                            - done
                            - pin
                            - urgent
                            - idea
                            - wip
                            - hold
                            - dropped
                            - reply
                            - waiting
                            - review
                    description: 'Marks of the note, to tell it at a glance, one at most for now: a color or a symbol (see list_marks for what each means to the user); absent for none'
