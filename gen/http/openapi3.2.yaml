                - path
        GitStatus:
            type: object
            properties:
                repository:
                    type: boolean
                    description: Whether the notes are in a git repository, so that git_sync can sync them; git is optional
                    example: false
                upstream:
                    type: string
                    description: Upstream branch that git_sync merges and pushes to; absent when there is none
                    example: origin/main
            example:
                repository: false
                upstream: origin/main
            required:
                - repository
        GitSyncRequestBody:
            type: object
            properties:
                remote:
                    type: string
                    description: 'URL of a remote repository to connect the notes to first, as the remote origin: the notes directory becomes a repository unless it is one, and the notes are pushed, setting the upstream branch; the notes already on the remote, such as from another machine, are merged first'
                    example: git@github.com:you/notes.git
            description: Request body for git_sync.
            example:
                remote: git@github.com:you/notes.git
        GitSyncResult:
            type: object
            properties:
                committed:
                    type: integer
                    description: Number of changed files committed
                    example: 4587836341878086885
                    format: int64
                conflicts:
                    type: array
                    items:
                        $ref: '#/components/schemas/GitConflict'
                    description: Files changed on both sides of the merge, or deleted on one side and changed on the other
                    example:
                        - copy_id: be4c1193735ee1
                          note_id: be4c1193735ee1
                          path: inbox/3f9a1c0e7b2d4a.yaml
                        - copy_id: be4c1193735ee1
                          note_id: be4c1193735ee1
                          path: inbox/3f9a1c0e7b2d4a.yaml
                        - copy_id: be4c1193735ee1
                          note_id: be4c1193735ee1
                          path: inbox/3f9a1c0e7b2d4a.yaml
                        - copy_id: be4c1193735ee1
                          note_id: be4c1193735ee1
                          path: inbox/3f9a1c0e7b2d4a.yaml
                errors:
                    type: array
                    items:
                        type: string
                        example: Odit libero quae odit culpa illo.
                    description: Files that could not be read when the index was updated after the sync
                    example:
                        - Odit libero quae odit culpa illo.
                        - Exercitationem consequatur.
                        - Nobis aliquam.
                        - Labore voluptate aut ducimus saepe.
                merged:
                    type: integer
                    description: Number of files changed by the merge of the upstream branch
                    example: 7055638964112614605
                    format: int64
                pushed:
                    type: boolean
                    description: Whether commits were pushed
                    example: true
                upstream:
                    type: string
                    description: Upstream branch merged and pushed to; absent when the branch has none, and then the changes are only committed
                    example: origin/main
            example:
                committed: 4587836341878086885
                conflicts:
                    - copy_id: be4c1193735ee1
                      note_id: be4c1193735ee1
                      path: inbox/3f9a1c0e7b2d4a.yaml
                    - copy_id: be4c1193735ee1
                      note_id: be4c1193735ee1
                      path: inbox/3f9a1c0e7b2d4a.yaml
                    - copy_id: be4c1193735ee1
                      note_id: be4c1193735ee1
                      path: inbox/3f9a1c0e7b2d4a.yaml
                    - copy_id: be4c1193735ee1
                      note_id: be4c1193735ee1
                      path: inbox/3f9a1c0e7b2d4a.yaml
                errors:
                    - Odit libero quae odit culpa illo.
                    - Exercitationem consequatur.
                    - Nobis aliquam.
                    - Labore voluptate aut ducimus saepe.
                merged: 7055638964112614605
                pushed: true
                upstream: origin/main
            required:
                - committed
                - merged
                - pushed
                - conflicts
                - errors
        ImportResult:
            type: object
            properties:
                duplicate_of:
                    type: string
                    description: 'When skipped: the note imported from the same content before'
                    example: be4c1193735ee1
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                note:
                    $ref: '#/components/schemas/Note2'
                status:
                    type: string
                    description: created, or skipped when a file with the same content was imported before
                    example: skipped
                    enum:
                        - created
                        - skipped
                warnings:
                    type: array
