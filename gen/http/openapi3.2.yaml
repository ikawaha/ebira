                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: bad_request
                                temporary: false
                                timeout: false
                "401":
                    description: 'unauthorized: The session is invalid or expired: sign in with a passkey again'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unauthorized
                                temporary: false
                                timeout: false
                "403":
                    description: 'verification_required: An important operation, such as making a private notebook visible to AI, reading the history of a note or emptying the trash, while passkeys are required and the session was not signed in with a passkey recently: sign in with the passkey again'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: verification_required
                                temporary: false
                                timeout: false
                "404":
                    description: 'not_found: The URL is unknown, used or expired, or the note does not exist or is hidden from AI clients'
                    content:
