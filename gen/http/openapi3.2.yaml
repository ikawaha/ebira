                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unauthorized
                                temporary: false
                                timeout: false
                "403":
                    description: 'verification_required: An important operation, such as making a private notebook visible to AI, reading the history of a note or emptying the trash, while passkeys are required and the session was not signed in with a passkey recently: sign in with the passkey again'
                    content:
                        application/vnd.goa.error:
                            schema:
