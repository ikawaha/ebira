openapi: 3.2.0
info:
    title: ebira API
    description: API for Markdown notes stored as YAML files and searched through a SQLite index.
    version: 0.1.0
servers:
    - url: http://localhost:13579
      name: ebira
paths:
    /archive/candidates:
        get:
            tags:
                - notes
            summary: archive_candidates notes
            description: 'List the notes that may be put in the archive: those not updated for days, oldest first, but those in the archive or the trash already, a page at a time.'
            operationId: notes#archive_candidates
            parameters:
                - name: days
                  in: query
                  description: Days the notes have not been updated for
                  allowEmptyValue: true
                  schema:
                    type: integer
                    description: Days the notes have not been updated for
                    default: 180
                    example: 8831
                    format: int64
                    minimum: 1
                    maximum: 36500
                  example: 8831
                - name: limit
                  in: query
                  description: Maximum number of notes
                  allowEmptyValue: true
                  schema:
                    type: integer
                    description: Maximum number of notes
                    default: 100
                    example: 398
                    format: int64
                    minimum: 1
                    maximum: 500
                  example: 398
                - name: offset
                  in: query
                  description: Number of notes to skip
                  allowEmptyValue: true
                  schema:
                    type: integer
                    description: Number of notes to skip
                    default: 0
                    example: 6553575800984633872
                    format: int64
                    minimum: 0
                  example: 6553575800984633872
