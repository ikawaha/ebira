        MachineSettings:
            type: object
            properties:
                auth:
                    type: string
                    description: How the REST API authenticates people; empty for none. passkey needs a passkey registered
                    example: none
                    enum:
                        - none
                        - passkey
                git_sync:
                    type: string
                    description: Interval of syncing the notes with git, such as 10m; empty or 0 for none
                    example: 10m
                lang:
                    type: string
                    description: Language of the UI; empty for the browser's
                    example: ja
                model:
                    type: string
                    description: Model of the assistant; empty for the default of the provider
                    example: Vel sit soluta aut corporis nostrum.
                provider:
                    type: string
                    description: Model provider of the assistant; empty for the one whose API key is set
                    example: anthropic
                    enum:
                        - anthropic
                        - gemini
                theme:
                    type: string
                    description: Color theme of the UI; empty for auto, the system's
                    example: auto
                    enum:
                        - auto
                        - light
                        - dark
                tui_preview:
                    type: string
                    description: How the preview of the TUI shows a note; empty for rendered
                    example: rendered
                    enum:
                        - rendered
                        - source
                watch:
                    type: boolean
                    description: Whether the server watches the notes directory; left out for true
                    example: true
            description: Settings of the server's machine and user, in its settings file, that the web UI changes; a value left out is the default
            example:
                auth: none
                git_sync: 10m
                lang: ja
                model: Vel sit soluta aut corporis nostrum.
                provider: anthropic
                theme: auto
                tui_preview: rendered
                watch: true
