    /notes:
        get:
            tags:
                - notes
            summary: list notes
            description: 'List notes in the order of sort, a page at a time: total tells how many there are, and offset reads the next page. The notes in the archive are left out unless archived asks for them; without a notebook, archived=only lists the notes put in the archive on their own, as those of the notebooks there are listed by their notebooks.'
            operationId: notes#list
            parameters:
                - name: notebook
                  in: query
                  description: Only notes in this notebook. Omit for all notebooks except the trash
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Only notes in this notebook. Omit for all notebooks except the trash
                    example: inbox
                    pattern: ^[a-z0-9][a-z0-9_-]{0,63}(/[a-z0-9][a-z0-9_-]{0,63})?$
                  example: inbox
                - name: tag
                  in: query
                  description: Only notes with this tag
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Only notes with this tag
                    example: Nulla molestiae voluptatum et.
                  example: Nulla molestiae voluptatum et.
                - name: limit
                  in: query
                  description: Maximum number of notes
                  allowEmptyValue: true
                  schema:
                    type: integer
                    description: Maximum number of notes
                    default: 50
                    example: 256
                    format: int64
                    minimum: 1
                    maximum: 500
                  example: 256
                - name: offset
                  in: query
                  description: Number of notes to skip
                  allowEmptyValue: true
                  schema:
