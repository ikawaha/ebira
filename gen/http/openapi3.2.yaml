    securitySchemes:
        session_cookie_ebira_session:
            type: apiKey
            description: 'Session of people signed in with a passkey, sent as the ebira_session cookie. While the server requires passkeys (auth: passkey), only a REST request with a valid session passes, as from people, and the others fail with unauthorized (AI clients use MCP, which does not take sessions); without passkeys (auth: none), every REST request is from people'
            name: ebira_session
            in: cookie
tags:
    - name: assistant
      description: Answers questions about the notes with the assistant agent.
    - name: notes
      description: CRUD and search for notes.
    - name: auth
      description: 'Passkeys: registering them and signing in with them, in the web UI and, through the web UI, in clients without a browser such as the TUI (a device flow). Not for AI clients, and not on MCP.'
