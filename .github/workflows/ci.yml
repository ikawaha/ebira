name: CI

on:
  pull_request:
  push:
    branches: [main]
  # GitHub runs no pull_request workflow for a push while the pull request
  # cannot be merged, as when it conflicts with main, and the push gets no
  # run when the conflict is resolved later: run it by hand then, with
  # gh workflow run CI --ref <branch>.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run of the one before; each push
# to main is checked to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The actions are pinned to the commits of their releases, with the version
# in a comment; Dependabot updates both.
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(gofmt -l cmd design internal)
          if [ -n "$files" ]; then
            echo "run gofmt -w on:"
            echo "$files"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go vet and build for Windows
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go vet ./...
          go build -o /dev/null ./cmd/ebira
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: goa gen
        # goa gen also writes AGENTS_QUICKSTART.md, which is not ebira's; only
        # gen/ is compared.
        run: |
          go run goa.design/goa/v3/cmd/goa gen github.com/ikawaha/ebira/design
          if [ -n "$(git status --porcelain -- gen)" ]; then
            echo "gen/ is out of date: run goa gen and commit it"
            git status --short -- gen
            git diff --stat -- gen
            exit 1
          fi

  desktop:
    # apps/desktop, the Wails app, is a module of its own, with cgo and Cocoa
    # on macOS, which builds it for Windows too.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "run gofmt -w on:"
            echo "$files"
            exit 1
          fi
      - run: go vet .
      - run: go build -o /dev/null .
      - run: go test .
      - name: go vet and build for Windows
        # The app needs no cgo on Windows, so it builds here too.
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go vet .
          go build -o /dev/null .
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  desktop-windows:
    # build-windows.ps1, for Windows with PowerShell alone, run by Windows
    # PowerShell 5.1 as it comes with Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: |
            go.sum
            apps/desktop/go.sum
      - name: build-windows.ps1
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File apps\desktop\build-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = 'apps\desktop\build\windows-amd64\ebira'
          foreach ($f in 'ebira.exe', 'ebira-desktop.exe', 'favicon.LICENSE') {
            if (-not (Test-Path "$out\$f")) { throw "$f is missing" }
          }
          & "$out\ebira.exe" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  codemirror:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/ui/web/codemirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: internal/ui/web/codemirror/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: vendor is up to date
        run: |
          if [ -n "$(git status --porcelain -- ../static/vendor)" ]; then
            echo "static/vendor is out of date: run npm ci && npm run build and commit it"
            git status --short -- ../static/vendor
            exit 1
          fi
